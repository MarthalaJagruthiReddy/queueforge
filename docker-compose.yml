services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: queueforge
      POSTGRES_PASSWORD: queueforge
      POSTGRES_DB: queueforge
    volumes:
      - queueforge-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

  api:
    build: ./backend-node
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgres://queueforge:queueforge@postgres:5432/queueforge
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: ./backend-node
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgres://queueforge:queueforge@postgres:5432/queueforge
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis

volumes:
  queueforge-postgres:
